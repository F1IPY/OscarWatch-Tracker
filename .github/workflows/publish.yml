# Build, test, and publish release packages on version tags (v*).
# Manual run: Actions → Publish → Run workflow.

name: Publish

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

env:
  DOTNET_VERSION: "10.0.x"
  PROJECT: OscarWatch/OscarWatch.csproj

jobs:
  validate:
    name: Build and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - run: dotnet build OscarWatch.slnx -c Release

      - run: dotnet test OscarWatch.slnx -c Release --no-build

  publish:
    name: ${{ matrix.display_name }}
    needs: validate
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - rid: win-x64
            os: windows-latest
            display_name: Windows x64
            archive_ext: zip
            publish_single_file: true
          - rid: win-arm64
            os: windows-latest
            display_name: Windows ARM64
            archive_ext: zip
            publish_single_file: true
          - rid: osx-arm64
            os: macos-latest
            display_name: macOS Apple Silicon
            archive_ext: tar.gz
            publish_single_file: false
          - rid: osx-x64
            os: macos-latest
            display_name: macOS Intel
            archive_ext: tar.gz
            publish_single_file: false
          - rid: linux-x64
            os: ubuntu-latest
            display_name: Linux x64
            archive_ext: tar.gz
            publish_single_file: false
          - rid: linux-arm64
            os: ubuntu-latest
            display_name: Linux ARM64 (Raspberry Pi 64-bit)
            archive_ext: tar.gz
            publish_single_file: false

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Resolve version
        id: version
        shell: bash
        run: |
          if [[ "${{ github.ref_type }}" == "tag" ]]; then
            ver="${GITHUB_REF_NAME#v}"
            echo "version=${ver}" >> "$GITHUB_OUTPUT"
            echo "assembly_version=${ver}" >> "$GITHUB_OUTPUT"
          else
            short="${GITHUB_SHA::7}"
            echo "version=0.0.0-ci.${short}" >> "$GITHUB_OUTPUT"
            # AssemblyVersion/FileVersion must be numeric (major.minor.build.revision).
            echo "assembly_version=0.0.0.0" >> "$GITHUB_OUTPUT"
          fi

      - name: Build oscarwatch_ft8 (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          rid="${{ matrix.rid }}"
          build_dir="native/oscarwatch_ft8/build-${rid}"
          out_dir="OscarWatch/runtimes/${rid}/native"
          mkdir -p "$out_dir"
          if [[ "$rid" == "win-arm64" ]]; then
            cmake -S native/oscarwatch_ft8 -B "$build_dir" -A ARM64
          else
            cmake -S native/oscarwatch_ft8 -B "$build_dir" -A x64
          fi
          cmake --build "$build_dir" --config Release
          dll="$(find "$build_dir" -name 'oscarwatch_ft8.dll' | head -n 1)"
          test -n "$dll"
          cp "$dll" "$out_dir/oscarwatch_ft8.dll"

      - name: Build oscarwatch_ft8 (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          rid="${{ matrix.rid }}"
          build_dir="native/oscarwatch_ft8/build-${rid}"
          out_dir="OscarWatch/runtimes/${rid}/native"
          mkdir -p "$out_dir"
          if [[ "$rid" == "osx-x64" ]]; then
            cmake -S native/oscarwatch_ft8 -B "$build_dir" -DCMAKE_OSX_ARCHITECTURES=x86_64
          else
            cmake -S native/oscarwatch_ft8 -B "$build_dir" -DCMAKE_OSX_ARCHITECTURES=arm64
          fi
          cmake --build "$build_dir" --config Release
          dylib="$(find "$build_dir" -name 'oscarwatch_ft8.dylib' | head -n 1)"
          test -n "$dylib"
          cp "$dylib" "$out_dir/oscarwatch_ft8.dylib"

      - name: Build oscarwatch_ft8 (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          rid="${{ matrix.rid }}"
          build_dir="native/oscarwatch_ft8/build-${rid}"
          out_dir="OscarWatch/runtimes/${rid}/native"
          mkdir -p "$out_dir"
          if [[ "$rid" == "linux-arm64" ]]; then
            sudo apt-get update
            sudo apt-get install -y gcc-aarch64-linux-gnu g++-aarch64-linux-gnu
            cmake -S native/oscarwatch_ft8 -B "$build_dir" \
              -DCMAKE_SYSTEM_NAME=Linux \
              -DCMAKE_SYSTEM_PROCESSOR=aarch64 \
              -DCMAKE_C_COMPILER=aarch64-linux-gnu-gcc
          else
            cmake -S native/oscarwatch_ft8 -B "$build_dir"
          fi
          cmake --build "$build_dir" --config Release
          so="$(find "$build_dir" -name 'oscarwatch_ft8.so' | head -n 1)"
          test -n "$so"
          cp "$so" "$out_dir/oscarwatch_ft8.so"

      - name: Publish (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $out = "${{ runner.temp }}/publish-${{ matrix.rid }}"
          $singleFile = "${{ matrix.publish_single_file }}"
          dotnet publish "${{ env.PROJECT }}" `
            -c Release `
            -r "${{ matrix.rid }}" `
            --self-contained true `
            -p:Version="${{ steps.version.outputs.version }}" `
            -p:AssemblyVersion="${{ steps.version.outputs.assembly_version }}" `
            -p:FileVersion="${{ steps.version.outputs.assembly_version }}" `
            -p:InformationalVersion="${{ steps.version.outputs.version }}" `
            -p:PublishSingleFile=$singleFile `
            -p:IncludeNativeLibrariesForSelfExtract=$singleFile `
            -o $out

      - name: Publish (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          out="${{ runner.temp }}/publish-${{ matrix.rid }}"
          dotnet publish "${{ env.PROJECT }}" \
            -c Release \
            -r "${{ matrix.rid }}" \
            --self-contained true \
            -p:Version="${{ steps.version.outputs.version }}" \
            -p:AssemblyVersion="${{ steps.version.outputs.assembly_version }}" \
            -p:FileVersion="${{ steps.version.outputs.assembly_version }}" \
            -p:InformationalVersion="${{ steps.version.outputs.version }}" \
            -o "$out"

      - name: Check FT4 native library is in the package
        shell: bash
        run: |
          set -euo pipefail
          out="${{ runner.temp }}/publish-${{ matrix.rid }}"
          rid="${{ matrix.rid }}"
          case "$rid" in
            win-*) file="oscarwatch_ft8.dll" ;;
            osx-*) file="oscarwatch_ft8.dylib" ;;
            linux-*) file="oscarwatch_ft8.so" ;;
            *) echo "Unknown RID: $rid"; exit 1 ;;
          esac
          path="$out/runtimes/$rid/native/$file"
          if [[ ! -f "$path" ]]; then
            echo "FT4 native library missing: $path"
            find "$out" -iname 'oscarwatch_ft8*' -print || true
            exit 1
          fi
          size=$(wc -c < "$path")
          echo "Found $path ($size bytes)"
          if [[ "$size" -lt 10000 ]]; then
            echo "FT4 native library looks too small: $path"
            exit 1
          fi

      - name: Archive
        id: archive
        shell: pwsh
        run: |
          $src = "${{ runner.temp }}/publish-${{ matrix.rid }}"
          $version = "${{ steps.version.outputs.version }}"
          $rid = "${{ matrix.rid }}"
          if ("${{ matrix.archive_ext }}" -eq "zip") {
            $dest = "${{ runner.temp }}/OscarWatch-${version}-${rid}.zip"
            Compress-Archive -Path "$src/*" -DestinationPath $dest -Force
          } else {
            $dest = "${{ runner.temp }}/OscarWatch-${version}-${rid}.tar.gz"
            tar -czf $dest -C $src .
          }
          echo "path=$dest" >> $env:GITHUB_OUTPUT

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: OscarWatch-${{ matrix.rid }}
          path: ${{ steps.archive.outputs.path }}
          if-no-files-found: error
          retention-days: 7

  release:
    name: GitHub Release
    needs: publish
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**
          generate_release_notes: true
